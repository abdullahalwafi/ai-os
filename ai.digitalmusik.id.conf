server {
    listen 80;
    listen [::]:80;
    server_name ai.digitalmusik.id;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/ai.digitalmusik.id;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://ai.digitalmusik.id$request_uri;
    }
}

map $http_upgrade $dm_ai_connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name ai.digitalmusik.id;

    ssl_certificate /etc/letsencrypt/live/ai.digitalmusik.id/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ai.digitalmusik.id/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_stapling off;
    client_max_body_size 256k;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;

    # Hermes runtime is a localhost-only server-to-server boundary. In
    # particular, its gated chat route can create a validated task.
    location = /hermes-runtime { return 404; }
    location ^~ /hermes-runtime/ { return 404; }

    location / {
        # Node authenticates POST /tasks and PATCH /tasks/:task_key/status.
        limit_except GET HEAD POST PATCH { deny all; }
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $dm_ai_connection_upgrade;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }
}
